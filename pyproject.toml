[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-forge"
version = "0.1.0"
description = "Model distillation, abliteration pipeline, and signed Ollama packaging for appEcosystem"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mikel Smart" }]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "cryptography>=42.0",
]

[project.scripts]
model-forge = "model_forge.cli:main"

[tool.setuptools.packages.find]
include = ["model_forge*"]

